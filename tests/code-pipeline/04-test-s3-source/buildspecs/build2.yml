version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 20
    on-failure: ABORT
    commands:
      - echo "Starting install"
  build:
    on-failure: ABORT
    commands:
      - echo "Starting build"
      - cat index.html
  post_build:
    on-failure: ABORT
    commands:
      - echo "Finished the build"
  name: builds/$CODEBUILD_BUILD_NUMBER/build-artifacts